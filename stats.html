<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Completion // Roady Bhop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
<style>
  /* ---- Completion page ---- */
  .lookup{display:flex;gap:12px;padding:14px;border-radius:16px;max-width:640px;margin:0 auto}
  .lookup input{flex:1;min-width:0;background:rgba(255,255,255,.04);border:1px solid var(--border);
    border-radius:999px;color:var(--fg);font-family:'JetBrains Mono',monospace;font-size:14px;
    padding:12px 20px;outline:none;transition:border-color .3s}
  .lookup input:focus{border-color:var(--accent-dim)}
  .lookup .btn{white-space:nowrap}

  .proxybar{max-width:640px;margin:14px auto 0;font-family:'JetBrains Mono',monospace;font-size:12px}
  .proxybar .pill{display:inline-flex;align-items:center;gap:8px;color:var(--muted);cursor:pointer;
    padding:6px 12px;border:1px solid var(--border);border-radius:999px;transition:color .3s,border-color .3s}
  .proxybar .pill:hover{color:var(--fg);border-color:var(--accent-dim)}
  .proxybar .dotok{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
  .proxybar .dotoff{width:7px;height:7px;border-radius:50%;background:#c9704f;box-shadow:0 0 8px #c9704f}

  .setup{max-width:640px;margin:18px auto 0;border-radius:16px;padding:22px 24px}
  .setup h3{font-family:'JetBrains Mono',monospace;font-size:14px;letter-spacing:.04em;color:var(--accent);margin-bottom:12px}
  .setup ol{margin:0 0 4px 18px;color:var(--muted);font-size:13.5px;line-height:1.9}
  .setup ol a{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
  .setup code{font-family:'JetBrains Mono',monospace;background:rgba(255,255,255,.05);border:1px solid var(--border);
    padding:1px 6px;border-radius:5px;font-size:12px}
  .setup .row{display:flex;gap:10px;margin-top:16px}
  .setup .row input{flex:1;min-width:0;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:10px;
    color:var(--fg);font-family:'JetBrains Mono',monospace;font-size:13px;padding:10px 14px;outline:none}
  .setup .row input:focus{border-color:var(--accent-dim)}

  .status{max-width:640px;margin:22px auto 0;text-align:center;font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--muted);min-height:20px}
  .status.err{color:#e08a6a}
  .spin{display:inline-block;width:13px;height:13px;border:2px solid var(--border);border-top-color:var(--accent);
    border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:8px}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* report */
  #report{margin-top:44px}
  .rep-head{display:flex;align-items:center;gap:18px;flex-wrap:wrap;border-radius:16px;padding:20px 22px;margin-bottom:20px}
  .rep-av{width:64px;height:64px;border-radius:14px;object-fit:cover;background:rgba(255,255,255,.05);
    border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:22px;color:var(--muted)}
  .rep-who .nm{font-size:22px;font-weight:700}
  .rep-who .sb{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);margin-top:4px}
  .rep-who .sb code{color:var(--accent)}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:12px}
  .kpi{border-radius:14px;padding:16px 18px}
  .kpi .v{font-size:22px;font-weight:700;color:var(--accent)}
  .kpi .l{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:5px}

  .controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:22px 2px 14px}
  .controls .cl{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted)}
  .seg{display:inline-flex;border:1px solid var(--border);border-radius:999px;overflow:hidden}
  .seg button{padding:6px 16px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);transition:all .25s}
  .seg button.on{background:var(--accent);color:#06100e}

  .rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px}
  .gcard{border-radius:16px;padding:18px 19px 19px;transition:border-color .3s}
  .gcard:hover{border-color:var(--accent-dim)}
  .gc-head{display:flex;align-items:baseline;gap:10px}
  .gc-head .diamond{width:9px;height:9px;translate:0 -1px}
  .gc-name{font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:500}
  .gc-cat{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .gc-right{margin-left:auto;text-align:right}
  .gc-pct{font-size:20px;font-weight:700;color:var(--accent);line-height:1}
  .gc-frac{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);margin-top:3px}

  .tracks{margin-top:15px;display:flex;flex-direction:column;gap:11px}
  .trk-top{display:grid;grid-template-columns:60px 1fr 70px 46px;align-items:center;gap:10px}
  .trk-l{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--fg)}
  .bar{height:8px;border-radius:6px;background:rgba(255,255,255,.06);overflow:hidden}
  .bar>i{display:block;height:100%;border-radius:6px;background:var(--accent)}
  .trk-f{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);text-align:right}
  .trk-f b{color:var(--fg)}
  .trk-p{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;text-align:right;color:var(--fg)}
  .trk-sub{margin-left:70px;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#6b727d;margin-top:3px}

  .tier-h{margin-top:15px;border-top:1px solid var(--border);padding-top:12px;
    font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .tier-h span{color:var(--accent)}
  .tiers{margin-top:9px;display:flex;flex-direction:column;gap:7px}
  .tr{display:grid;grid-template-columns:52px 1fr 56px;align-items:center;gap:10px;font-family:'JetBrains Mono',monospace;font-size:11px}
  .tr .tl{color:var(--muted)}
  .tr .tb{height:7px;border-radius:5px;background:rgba(255,255,255,.06);overflow:hidden}
  .tr .tb>i{display:block;height:100%;border-radius:5px;background:var(--accent)}
  .tr .tc{text-align:right;color:var(--muted)}
  .tr .tc b{color:var(--fg)}
  .tr.z .tc{color:#5b626d}
  .tempty{font-family:'JetBrains Mono',monospace;font-size:11px;color:#5b626d}

  .repnote{margin-top:28px;font-size:12px;line-height:1.7;color:#6b727d;border-top:1px solid var(--border);padding-top:16px}
  .repnote b{color:var(--muted)}

  /* all-gamemodes summary box */
  .allcard{margin-top:16px;border-color:var(--accent-dim);
    background:linear-gradient(180deg,rgba(111,224,208,.06),rgba(255,255,255,.012))}
  .allcard .gc-name{font-size:17px}
  .allcard .alltiers{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:7px 24px}

  /* clickable affordances */
  .lnk{cursor:pointer}
  .trk-top.lnk{border-radius:6px;transition:background .2s}
  .trk-top.lnk:hover{background:rgba(111,224,208,.07)}
  .gc-head.lnk{border-radius:8px;transition:background .2s}
  .gc-head.lnk:hover{background:rgba(111,224,208,.05)}
  .gc-head.lnk:hover .gc-name{color:var(--accent)}
  .tr.lnk{border-radius:5px;transition:background .2s}
  .tr.lnk:hover{background:rgba(111,224,208,.07)}
  .trk-sub .lnk{transition:color .2s}
  .trk-sub .lnk:hover{color:var(--accent)}
  .kpi.lnk{transition:border-color .2s,transform .2s}
  .kpi.lnk:hover{border-color:var(--accent-dim);transform:translateY(-2px)}
  .click-hint{margin:0 2px 14px;font-family:'JetBrains Mono',monospace;font-size:11px;color:#6b727d}

  /* browse drawer */
  .drawer-back{position:fixed;inset:0;z-index:60;background:rgba(4,5,7,.72);backdrop-filter:blur(4px);
    opacity:0;pointer-events:none;transition:opacity .3s}
  .drawer-back.open{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(600px,100%);z-index:61;display:flex;flex-direction:column;
    background:linear-gradient(180deg,var(--bg-1),var(--bg));border-left:1px solid var(--border);
    transform:translateX(100%);transition:transform .35s cubic-bezier(.16,1,.3,1);box-shadow:-24px 0 60px rgba(0,0,0,.45)}
  .drawer.open{transform:translateX(0)}
  .dr-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border);flex:0 0 auto}
  .dr-title{font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:500}
  .dr-close{color:var(--muted);padding:6px;line-height:0}
  .dr-close:hover{color:var(--fg)}
  .dr-close svg{width:20px;height:20px}
  .dr-filters{padding:16px 22px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:11px;flex:0 0 auto}
  .dr-field{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .dr-field>span:first-child{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);width:88px;flex:0 0 auto}
  .dr-field select{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:8px;color:var(--fg);font-family:inherit;font-size:13px;padding:7px 10px;outline:none}
  .dr-field select:focus{border-color:var(--accent-dim)}
  .drseg button{padding:5px 12px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{min-width:30px;height:30px;padding:0 6px;border:1px solid var(--border);border-radius:8px;color:var(--muted);
    font-family:'JetBrains Mono',monospace;font-size:12px;transition:all .2s}
  .chip[data-tier="all"]{padding:0 12px}
  .chip:hover{border-color:var(--accent-dim);color:var(--fg)}
  .chip.on{background:var(--accent);color:#06100e;border-color:var(--accent)}
  .dr-note{color:#6b727d;font-family:'JetBrains Mono',monospace;font-size:12px}
  .dr-count{padding:12px 22px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);border-bottom:1px solid var(--border);flex:0 0 auto}
  .dr-count b{color:var(--accent)}
  .dr-list{flex:1 1 auto;overflow-y:auto;padding:8px 12px 48px}
  .mrow{display:grid;grid-template-columns:20px 1fr auto;align-items:center;gap:10px;padding:9px 12px;border-radius:8px}
  .mrow:hover{background:rgba(255,255,255,.035)}
  .mrow:not(.is-done){opacity:.8}
  .mmark{color:var(--accent);display:flex;justify-content:center}
  .mmark svg{width:15px;height:15px}
  .mname{font-family:'JetBrains Mono',monospace;font-size:13px;word-break:break-all}
  .mrow:not(.is-done) .mname{color:var(--muted)}
  .mmeta{font-family:'JetBrains Mono',monospace;font-size:10px;color:#6b727d;text-align:right;white-space:nowrap}
  .dr-empty{padding:36px 20px;text-align:center;color:#6b727d;font-family:'JetBrains Mono',monospace;font-size:13px}

  @media(max-width:600px){ .lookup{flex-direction:column} }
  @media(max-width:560px){ .mmeta{display:none} }
</style>
</head>
<body>
<div class="liminal-bg"></div>
<div class="grain"></div>

  <div class="container nav-inner">
    <a href="index.html" class="brand"><span class="diamond diamond-float"></span><span class="label">Roady</span></a>
    <nav class="nav-links">
      <a href="index.html">Home</a>

  </div>
  <div class="mobile-menu glass">

    <a href="about.html">About</a>

</header>

<main class="page-fade">
  <section class="container-sm pt-nav">
    <div class="page-head reveal">
      <span class="eyebrow">// Momentum Mod</span>
      <h1>Completion</h1>
      <p>Look up any player's map completion &mdash; per gamemode, and by tier within each mode.</p>
    </div>

    <form id="lookup" class="lookup glass reveal">
      <input id="q" type="text" placeholder="username, user ID, or SteamID64" autocomplete="off" spellcheck="false" />
      <button class="btn btn-primary" type="submit">Look up <span data-icon="arrow"></span></button>
    </form>

    <div id="proxybar" class="proxybar reveal" style="text-align:center"></div>
    <div id="setup"></div>
    <div id="status" class="status"></div>

  </section>

</html>
